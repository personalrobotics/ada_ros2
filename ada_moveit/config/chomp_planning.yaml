# This file's content is loaded by MoveItConfigsBuilder for the "chomp" pipeline.
# The CHOMP planner plugin will then look for parameters under these group names.

planning_plugin: chomp_interface/CHOMPPlanner
request_adapters: >-
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints

# Parameters for the 'jaco_arm' planning group when using CHOMP
jaco_arm:
  # CHOMP specific parameters for this group
  planning_time_limit: 10.0
  max_iterations: 200
  max_iterations_after_collision_free: 10
  smoothness_cost_weight: 0.1
  obstacle_cost_weight: 1.0
  learning_rate: 0.01
  ridge_factor: 0.001
  # collision_threshold: 0.07 # Often handled by cost function directly

# Parameters for the 'articutool' planning group when using CHOMP
articutool:
  planning_time_limit: 5.0
  max_iterations: 100
  # ... (other CHOMP parameters tailored for this group) ...

# Parameters for 'jaco_arm_with_articutool' planning group when using CHOMP
jaco_arm_with_articutool:
  planning_time_limit: 15.0
  max_iterations: 250
  # ... (other CHOMP parameters tailored for this group) ...
